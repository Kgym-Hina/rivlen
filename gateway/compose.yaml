services:
  rivlen-gateway:
    build: .
    restart: unless-stopped
    ports:
      - "${RIVLEN_BIND:-127.0.0.1}:${RIVLEN_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RIVLEN_GATEWAY_LISTEN: 0.0.0.0:8787
      RIVLEN_NODE_RED_URL: ${RIVLEN_NODE_RED_URL:-http://host.docker.internal:1880}
      RIVLEN_PUBLIC_URL: ${RIVLEN_PUBLIC_URL:?Set an HTTPS URL or a private LAN URL}
      RIVLEN_PAIRING_PASSWORD: ${RIVLEN_PAIRING_PASSWORD:?Set a custom password with at least 12 characters}
      RIVLEN_NODE_RED_AUTH_MODE: ${RIVLEN_NODE_RED_AUTH_MODE:-admin}
      RIVLEN_NODE_RED_TOKEN: ${RIVLEN_NODE_RED_TOKEN:-}
      RIVLEN_NODE_RED_USERNAME: ${RIVLEN_NODE_RED_USERNAME:-}
      RIVLEN_NODE_RED_PASSWORD: ${RIVLEN_NODE_RED_PASSWORD:-}
      RIVLEN_DATA_FILE: /data/gateway.json
      RIVLEN_TLS_CERT: ${RIVLEN_TLS_CERT:-}
      RIVLEN_TLS_KEY: ${RIVLEN_TLS_KEY:-}
    volumes:
      - gateway-data:/data
      - ./certs:/certs:ro

volumes:
  gateway-data:
